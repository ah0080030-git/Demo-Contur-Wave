<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Mountain Contour Loader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            let width = window.innerWidth;
            let height = window.innerHeight;
            let time = 0;

            // Interactive mouse tracking with smooth lerp
            const mouse = {
                x: -9999,
                y: -9999,
                targetX: -9999,
                targetY: -9999,
                active: false
            };

            function handlePointerMove(e) {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                mouse.targetX = clientX;
                mouse.targetY = clientY;

                if (!mouse.active) {
                    mouse.x = mouse.targetX;
                    mouse.y = mouse.targetY;
                    mouse.active = true;
                }
            }

            function handlePointerLeave() {
                mouse.active = false;
                mouse.targetX = -9999;
                mouse.targetY = -9999;
            }

            window.addEventListener('mousemove', handlePointerMove);
            window.addEventListener('touchmove', handlePointerMove, { passive: true });
            window.addEventListener('mouseout', handlePointerLeave);
            window.addEventListener('touchend', handlePointerLeave);

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                const dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.floor(width * dpr);
                canvas.height = Math.floor(height * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            window.addEventListener('resize', resize);
            resize();

            // Elevation equation with center-to-edge ripple & cursor displacement
            function getHeight(px, py, cx, cy, maxR, t, mx, my) {
                const dx = px - cx;
                const dy = py - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const normDist = dist / maxR;

                if (normDist > 1.05) return 0;

                // Bell curve mountain base
                const mountainCore = Math.exp(-Math.pow(normDist * 2.1, 2));

                // Natural ridges
                const angle = Math.atan2(dy, dx);
                const ridges =
                    Math.cos(angle * 3 + Math.sin(normDist * 3)) * 0.14 * (1 - normDist) +
                    Math.sin(angle * 5 - normDist * 4) * 0.08 * (1 - normDist);

                // Ultra slow outward wave from center to edge
                const waveFreq = 16.0;
                const waveSpeed = 0.65;
                const outwardRipple =
                    Math.sin(normDist * waveFreq - t * waveSpeed) *
                    0.18 *
                    Math.sin(normDist * Math.PI);

                // Subtle ambient noise drift
                const noiseDrift =
                    Math.sin(px * 0.015 + t * 0.15) *
                    Math.cos(py * 0.015 + t * 0.12) *
                    0.06 *
                    (1 - normDist);

                // Interactive cursor deformation
                let mouseInfluence = 0;
                if (mx > -1000 && my > -1000) {
                    const mdx = px - mx;
                    const mdy = py - my;
                    const mDist = Math.sqrt(mdx * mdx + mdy * mdy);
                    const radius = 110;

                    if (mDist < radius) {
                        const mNorm = mDist / radius;
                        const push = Math.exp(-Math.pow(mNorm * 2.2, 2)) * 0.28;
                        const ripple = Math.sin(mNorm * Math.PI * 3.5 - t * 4) * 0.09 * (1 - mNorm);
                        mouseInfluence = (push + ripple) * (1 - normDist * 0.6);
                    }
                }

                const h = mountainCore + ridges + outwardRipple + noiseDrift + mouseInfluence;
                return Math.max(0, h);
            }

            function render() {
                const cx = width / 2;
                const cy = height / 2;
                const maxR = Math.min(width, height) * 0.44;

                // Lerp mouse cursor motion for fluid inertia
                if (mouse.active) {
                    mouse.x += (mouse.targetX - mouse.x) * 0.12;
                    mouse.y += (mouse.targetY - mouse.y) * 0.12;
                } else {
                    mouse.x += (-9999 - mouse.x) * 0.12;
                    mouse.y += (-9999 - mouse.y) * 0.12;
                }

                // Clean dark background
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, width, height);

                // Background radial vignette
                const bgGrad = ctx.createRadialGradient(cx, cy, maxR * 0.2, cx, cy, maxR * 1.3);
                bgGrad.addColorStop(0, 'rgba(18, 18, 18, 0.4)');
                bgGrad.addColorStop(0.7, 'rgba(5, 5, 5, 0.9)');
                bgGrad.addColorStop(1, '#050505');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, width, height);

                // Marching squares sample grid
                const step = 6;
                const startX = cx - maxR;
                const endX = cx + maxR;
                const startY = cy - maxR;
                const endY = cy + maxR;

                const cols = Math.ceil((endX - startX) / step) + 1;
                const rows = Math.ceil((endY - startY) / step) + 1;

                const grid = [];
                for (let j = 0; j < rows; j++) {
                    const py = startY + j * step;
                    grid[j] = new Float32Array(cols);
                    for (let i = 0; i < cols; i++) {
                        const px = startX + i * step;
                        grid[j][i] = getHeight(px, py, cx, cy, maxR, time, mouse.x, mouse.y);
                    }
                }

                const numLevels = 26;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                for (let l = 1; l <= numLevels; l++) {
                    const isMajor = l % 5 === 0;
                    const threshold = (l / (numLevels + 1)) * 1.05;

                    ctx.beginPath();

                    for (let j = 0; j < rows - 1; j++) {
                        const y0 = startY + j * step;
                        const y1 = y0 + step;

                        for (let i = 0; i < cols - 1; i++) {
                            const x0 = startX + i * step;
                            const x1 = x0 + step;

                            const v0 = grid[j][i];
                            const v1 = grid[j][i + 1];
                            const v2 = grid[j + 1][i + 1];
                            const v3 = grid[j + 1][i];

                            let cellIndex = 0;
                            if (v0 >= threshold) cellIndex |= 1;
                            if (v1 >= threshold) cellIndex |= 2;
                            if (v2 >= threshold) cellIndex |= 4;
                            if (v3 >= threshold) cellIndex |= 8;

                            if (cellIndex === 0 || cellIndex === 15) continue;

                            const top = [x0 + ((threshold - v0) / (v1 - v0 || 1e-5)) * step, y0];
                            const right = [x1, y0 + ((threshold - v1) / (v2 - v1 || 1e-5)) * step];
                            const bottom = [x0 + ((threshold - v3) / (v2 - v3 || 1e-5)) * step, y1];
                            const left = [x0, y0 + ((threshold - v0) / (v3 - v0 || 1e-5)) * step];

                            switch (cellIndex) {
                                case 1:
                                case 14:
                                    ctx.moveTo(left[0], left[1]);
                                    ctx.lineTo(top[0], top[1]);
                                    break;
                                case 2:
                                case 13:
                                    ctx.moveTo(top[0], top[1]);
                                    ctx.lineTo(right[0], right[1]);
                                    break;
                                case 3:
                                case 12:
                                    ctx.moveTo(left[0], left[1]);
                                    ctx.lineTo(right[0], right[1]);
                                    break;
                                case 4:
                                case 11:
                                    ctx.moveTo(right[0], right[1]);
                                    ctx.lineTo(bottom[0], bottom[1]);
                                    break;
                                case 5:
                                    ctx.moveTo(left[0], left[1]);
                                    ctx.lineTo(top[0], top[1]);
                                    ctx.moveTo(right[0], right[1]);
                                    ctx.lineTo(bottom[0], bottom[1]);
                                    break;
                                case 6:
                                case 9:
                                    ctx.moveTo(top[0], top[1]);
                                    ctx.lineTo(bottom[0], bottom[1]);
                                    break;
                                case 7:
                                case 8:
                                    ctx.moveTo(left[0], left[1]);
                                    ctx.lineTo(bottom[0], bottom[1]);
                                    break;
                                case 10:
                                    ctx.moveTo(top[0], top[1]);
                                    ctx.lineTo(right[0], right[1]);
                                    ctx.moveTo(left[0], left[1]);
                                    ctx.lineTo(bottom[0], bottom[1]);
                                    break;
                            }
                        }
                    }

                    // Cursor proximity glow detection
                    let cursorProximityGlow = 0;
                    if (mouse.active && mouse.x > -1000) {
                        const distToMouse = Math.sqrt(Math.pow(cx - mouse.x, 2) + Math.pow(cy - mouse.y, 2));
                        const cursorElev = 1 - Math.min(1, distToMouse / maxR);
                        const levelDiff = Math.abs(threshold - cursorElev);
                        if (levelDiff < 0.12) {
                            cursorProximityGlow = (1 - levelDiff / 0.12) * 0.45;
                        }
                    }

                    const normLevel = l / numLevels;
                    const alpha = Math.min(
                        1,
                        (isMajor ? 0.55 + normLevel * 0.35 : 0.16 + normLevel * 0.24) + cursorProximityGlow
                    );
                    const brightness = Math.min(255, Math.floor(180 + normLevel * 75 + cursorProximityGlow * 120));

                    ctx.strokeStyle = `rgba(${brightness}, ${brightness}, ${brightness}, ${alpha})`;
                    ctx.lineWidth = isMajor ? 1.4 + cursorProximityGlow * 0.8 : 0.85 + cursorProximityGlow * 0.5;

                    if (isMajor || cursorProximityGlow > 0.15) {
                        ctx.shadowColor = `rgba(255, 255, 255, ${0.25 + cursorProximityGlow * 0.4})`;
                        ctx.shadowBlur = 4 + cursorProximityGlow * 8;
                    } else {
                        ctx.shadowBlur = 0;
                    }

                    ctx.stroke();
                }

                // Subtle peak marker
                ctx.beginPath();
                ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
                ctx.shadowBlur = 8;
                ctx.fill();

                // Gentle spotlight glow under cursor
                if (mouse.active && mouse.x > 0 && mouse.y > 0) {
                    const glowGrad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 80);
                    glowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.12)');
                    glowGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.03)');
                    glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = glowGrad;
                    ctx.beginPath();
                    ctx.arc(mouse.x, mouse.y, 80, 0, Math.PI * 2);
                    ctx.fill();
                }

                time += 0.016;
                requestAnimationFrame(render);
            }

            requestAnimationFrame(render);
        })();
    </script>
</body>
</html>
